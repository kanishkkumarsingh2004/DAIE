[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daie"
version = "1.0.5"
authors = [
  { name="Kanishk Kumar Singh", email="kanishkkumar2004@gmail.com" }
]
description = "A professional, optimized Python library for creating and managing AI agents with intelligent tool selection and LLM integration"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0.0",
    "selenium>=4.18.0",
    "webdriver-manager>=4.0.0",
    "uvicorn>=0.40.0",
    "websockets>=12.0",
    "nats-py>=2.6.0",
    "pyaudio>=0.2.14",
    "zeroconf>=0.130.0",
    "kademlia>=2.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
]

vector = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.40.0",
]

dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "nbsphinx>=0.9.0",
]

[project.scripts]
daie = "daie.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
