[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daie"
version = "1.0.7"
authors = [
  { name="Kanishk Kumar Singh", email="kanishkkumar2004@gmail.com" }
]
description = "A professional, production-ready Python library for building autonomous AI agents with tool use, multi-agent orchestration, P2P networking, and persistent memory"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0.0",
    "selenium>=4.18.0",
    "webdriver-manager>=4.0.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "nats-py>=2.6.0",
    "zeroconf>=0.130.0",
    "kademlia>=2.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
audio = [
    "pyaudio>=0.2.14",
]

vision = [
    "opencv-python>=4.8.0",
]

vector = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

faiss = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
]

search = [
    "duckduckgo-search>=6.0.0",
    "tavily-python>=0.3.1",
]

playwright = [
    "playwright>=1.40.0",
]

database = [
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
]

email = [
    "google-api-python-client>=2.0.0",
    "icalendar>=5.0.0",
]

server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.29.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "nbsphinx>=0.9.0",
]

all = [
    "daie[audio,vision,vector,faiss,search,playwright,database,email,server]",
]

[project.scripts]
daie = "daie.cli.main:cli"

[project.urls]
"Homepage" = "https://github.com/kanishkkumarsingh2004/decentralized-ai-ecosystem"
"Bug Tracker" = "https://github.com/kanishkkumarsingh2004/decentralized-ai-ecosystem/issues"
"Changelog" = "https://github.com/kanishkkumarsingh2004/decentralized-ai-ecosystem/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501", "E722", "F401", "F811", "F402", "F841", "W293"]
exclude = [".git", "__pycache__", "build", "dist", "venv", ".venv", "examples"]
